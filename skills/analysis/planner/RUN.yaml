# One key per line. Change values in place. Quote text that has a colon.
id: R01
slug: "baseline"
status: open          # open | candidate | superseded | dropped | shipped
parent: null          # the run this run changes, for example R01
created: "YYYY-MM-DD"
question: "<one sentence>"
decision: "<the decision the result serves, and who makes it>"
inputs: []           # earlier runs that this run uses, for example [R01, R02]
samples: "<inclusion rule, exclusion rule, counts>"
method: "<one line, with the package>"
params: {}
prior: "<published result with reference, or: none found>"
done_when: "<the number, table, or figure that ends the analysis>"
success: "<the threshold that makes the answer yes, for example: specificity >= 95%>"
success_source: "set by person"   # set by person | assumed
controls:             # fixed before the data are analysed. result: "status - evidence"
  positive:
    plan: "<a known effect that must appear in these data, not the predictor under test>"
    result: "todo"
  negative:
    plan: "<the same analysis with shuffled outcome labels; the effect must disappear>"
    result: "todo"
  robustness:
    plan: "<nearby thresholds and named subgroups; the answer must not flip>"
    result: "todo"
rules: {}             # RULE-NN: "<how this run follows the rule>" or "deviation - LOG.md <date>"
checks:               # name: "status - evidence". status: todo | pass | warn | fail | n/a
  ids-match: "todo"
todo: []              # each doubt as one line: "not checked", "maybe", "possibly new"
literature: null      # before the word "new": {date: "YYYY-MM-DD", queries: ["..."], found: "<what exists>"}
result: "<one sentence, empty while open>"
verdict: null         # written by the skill "judge" only: "pass - <date>" or "veto - Q<n>: <reason>"
notes: "<why this run exists; post-hoc changes; reasons for warn checks; why it was dropped>"
